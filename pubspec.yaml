name: test_riverpod
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_cache:
    path: packages/app_cache
  app_config:
    path: packages/app_config
  app_monitoring:
    path: packages/app_monitoring
  app_network:
    path: packages/app_network
  app_notifications:
    path: packages/app_notifications
  app_routing:
    path: packages/app_routing
  app_store:
    path: packages/app_store
  cupertino_icons: ^1.0.8
  firebase_core: any
  firebase_crashlytics: any
  firebase_messaging: any
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  path_provider: ^2.1.5
  responsive_framework: ^1.5.1
  riverpod_annotation: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: any
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  riverpod_generator: any

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/onboarding/

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true
